# Publica la imagen del fork espuni de EUDIPLO en GHCR con un tag explícito, para
# que el droplet de producción haga `docker pull` en vez de construir en el host
# (ver docs/notes/EUDIPLO_CAPACITY_BASELINE.md en cp-platform). Workflow propio y
# mínimo — NO toca el pipeline de release de upstream (ci-and-release.yml).
name: Publicar imagen espuni (GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag explícito de la imagen (p. ej. v5.1.0-espuni.1)'
        required: true
        type: string
  push:
    tags:
      - 'espuni-v*' # empujar un tag espuni-vX.Y.Z también dispara la publicación

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: eudiplo
            image: ghcr.io/eudiaas/eudiplo
          - target: client
            image: ghcr.io/eudiaas/eudiplo-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=sha,format=short

      - name: Build y push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
